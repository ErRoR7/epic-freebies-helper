name: epic-freebies-helper

services:
  epic-freebies-helper:
    image: ghcr.io/ronchy2000/epic-freebies-helper:latest
    restart: always
    container_name: epic-freebies-helper

    environment:
      - TZ=Asia/Shanghai

      # ----------------------------------------
      # Core account configuration
      # ----------------------------------------
      - EPIC_EMAIL=your-email@example.com
      - EPIC_PASSWORD=your-password

      # ----------------------------------------
      # Captcha solving (NoneCap)
      # ----------------------------------------
      - NONECAP_API_KEY=your_nonecap_api_key

      # ----------------------------------------
      # Runtime parameters
      # ----------------------------------------
      - ENABLE_APSCHEDULER=true
      - BROWSER_BACKEND=auto
      - HEADLESS=virtual
      - BROWSER_PROXY=${BROWSER_PROXY:-}

      - EXECUTION_TIMEOUT=120
      - RESPONSE_TIMEOUT=30

    volumes:
      - "./volumes/:/app/app/volumes/"

    entrypoint: [ "/usr/bin/tini", "--" ]
    command: xvfb-run --auto-servernum --server-num=1 --server-args='-screen 0, 1920x1080x24' uv run app/deploy.py

    mem_limit: 4g
    shm_size: '2gb'
